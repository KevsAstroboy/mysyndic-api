services:
  postgres:
    image: postgres:16
    container_name: mysyndic-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    command:
      - postgres
      - -c
      - max_prepared_transactions=100
    networks:
      - mysyndic-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  mongodb:
    image: mongo:7
    container_name: mysyndic-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    ports:
      - '${MONGO_PORT:-27018}:27017'
    volumes:
      - mongo_data:/data/db
    networks:
      - mysyndic-network
    command: mongod --quiet
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/27017"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: mysyndic-redis
    ports:
      - '${REDIS_PORT:-6380}:6379'
    volumes:
      - redis_data:/data
    networks:
      - mysyndic-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  minio:
    image: minio/minio:latest
    container_name: mysyndic-minio
    ports:
      - '${MINIO_PORT:-9010}:9000'
      - '${MINIO_CONSOLE_PORT:-9011}:9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_DEFAULT_BUCKETS: ${MINIO_BUCKET}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - mysyndic-network
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mysyndic-api
    ports:
      - '${PORT:-3001}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - mysyndic-network
    command: sh -c "npm install --no-audit --no-fund && npx prisma generate && npm run start:dev"
    restart: unless-stopped

  prisma-sync:
    image: node:22-alpine
    container_name: mysyndic-prisma-sync
    profiles:
      - setup
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - .:/app
    working_dir: /app
    networks:
      - mysyndic-network
    command: >
      sh -c "
        apk add --no-cache openssl &&
        npm install --no-audit --no-fund &&
        npx prisma db pull &&
        npx prisma generate &&
        echo 'schema.prisma genere avec succes'
      "

networks:
  mysyndic-network:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  minio_data:
